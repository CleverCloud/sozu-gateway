# HTTPRoute RequestRedirect filter (Gateway API) — redirect-only routes.
#
# A redirect rule has NO backendRef (the Gateway API forbids combining them):
# Sōzu answers the redirect itself, so no Deployment/Service is needed here.
#   scheme + statusCode are supported, and so are hostname, path
#   (ReplaceFullPath) and port targets. A path target keeps the request's query
#   string on every match but the root prefix `/`, where Sōzu drops it.
#
# Verify:
#   curl -i -H 'Host: old.example.com' http://<lb-ip>/
#   # HTTP/1.1 301 Moved Permanently
#   # Location: https://old.example.com/
#   curl -i -H 'Host: moved.example.com' 'http://<lb-ip>/old/page?q=1'
#   # HTTP/1.1 302 Found
#   # Location: http://moved.example.com/new?q=1
#
# Requires the Gateway API CRDs installed in the cluster.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: sozu
spec:
  controllerName: sozu.io/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: examples-gw
  namespace: sozu-demo
spec:
  gatewayClassName: sozu
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect
  namespace: sozu-demo
spec:
  parentRefs:
    - name: examples-gw
      sectionName: http
  hostnames: ["old.example.com"]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-path
  namespace: sozu-demo
spec:
  parentRefs:
    - name: examples-gw
      sectionName: http
  hostnames: ["moved.example.com"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /old
      filters:
        - type: RequestRedirect
          requestRedirect:
            statusCode: 302
            path:
              type: ReplaceFullPath
              replaceFullPath: /new
