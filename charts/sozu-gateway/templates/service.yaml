{{- include "sozu-gateway.validateExposure" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sozu-gateway.fullname" . }}
  labels:
    {{- include "sozu-gateway.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if eq .Values.service.type "LoadBalancer" }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  selector:
    {{- include "sozu-gateway.selectorLabels" . | nindent 4 }}
  # `exposure` is the single source of this Service's ports, layer 4 included.
  # `l4.tcpServices`/`udpServices` used to render their own entries too, which
  # could not work: the controller only programs a mapping whose port the
  # exposure table carries, and a port in both places is the same
  # (port, protocol) twice — which the apiserver rejects outright.
  ports:
    {{- range .Values.exposure }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .bind }}
      protocol: {{ .transport | default "TCP" }}
    {{- end }}
