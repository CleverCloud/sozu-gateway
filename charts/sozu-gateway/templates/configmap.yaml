apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sozu-gateway.fullname" . }}-sozu
  labels:
    {{- include "sozu-gateway.labels" . | nindent 4 }}
data:
  config.toml: |
    # Rendered by Helm — keep in sync with deploy/sozu/config.toml.
    command_socket = "/run/sozu/sozu.sock"
    command_buffer_size = 163_840
    max_command_buffer_size = 1_638_400

    log_level = "{{ .Values.sozu.logLevel }}"
    log_target = "stdout"

    worker_count = {{ .Values.sozu.workerCount }}
    worker_automatic_restart = true
    handle_process_affinity = false

    buffer_size = 16_393
    max_connections = 10_000

    pid_file_path = "/run/sozu/sozu.pid"
    activate_listeners = true

    [[listeners]]
    protocol = "http"
    address = "0.0.0.0:{{ (fromJson (include "sozu-gateway.exposureFor" (dict "root" . "proto" "HTTP"))).bind }}"
    {{- with .Values.sozu.hardening.sozuIdHeader }}
    sozu_id_header = {{ . | quote }}
    {{- end }}
    {{- with .Values.sozu.hardening.sendXRealIp }}
    send_x_real_ip = {{ . }}
    {{- end }}
    {{- with .Values.sozu.hardening.elideXRealIp }}
    elide_x_real_ip = {{ . }}
    {{- end }}

    [[listeners]]
    protocol = "https"
    address = "0.0.0.0:{{ (fromJson (include "sozu-gateway.exposureFor" (dict "root" . "proto" "HTTPS"))).bind }}"
    tls_versions = ["TLS_V12", "TLS_V13"]
    {{- with .Values.sozu.hardening.sozuIdHeader }}
    sozu_id_header = {{ . | quote }}
    {{- end }}
    {{- if not (kindIs "invalid" .Values.sozu.hardening.strictSniBinding) }}
    strict_sni_binding = {{ .Values.sozu.hardening.strictSniBinding }}
    {{- end }}
    {{- with .Values.sozu.hardening.sendXRealIp }}
    send_x_real_ip = {{ . }}
    {{- end }}
    {{- with .Values.sozu.hardening.elideXRealIp }}
    elide_x_real_ip = {{ . }}
    {{- end }}
    {{- if .Values.sozu.hardening.hsts.enabled }}
    [listeners.hsts]
    enabled = true
    {{- with .Values.sozu.hardening.hsts.maxAge }}
    max_age = {{ printf "%.0f" (float64 .) }}
    {{- end }}
    {{- with .Values.sozu.hardening.hsts.includeSubdomains }}
    include_subdomains = {{ . }}
    {{- end }}
    {{- with .Values.sozu.hardening.hsts.preload }}
    preload = {{ . }}
    {{- end }}
    {{- end }}
