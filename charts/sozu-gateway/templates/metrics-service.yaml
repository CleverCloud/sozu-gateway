{{- define "sozu-gateway.metrics-service" -}}
{{- if .Values.metrics.enabled }}
# Internal ClusterIP Service for the controller's Prometheus /metrics endpoint.
# Kept separate from the data-plane LoadBalancer Service so the metrics port is
# never externally routable; it is the scrape target for the ServiceMonitor.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sozu-gateway.fullname" . }}-metrics
  labels:
    {{- include "sozu-gateway.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "sozu-gateway.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      # Numeric, not the port's name: a name is resolved against every container
      # in Pod order, and Sōzu comes first.
      targetPort: {{ .Values.metrics.port }}
      protocol: TCP
{{- end }}

{{- end -}}
{{- include "sozu-gateway.renderInstances" (dict "root" . "template" "sozu-gateway.metrics-service") }}
