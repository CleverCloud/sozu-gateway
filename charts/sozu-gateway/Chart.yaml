# time from the git tag (e.g. v0.2.0 -> chart 0.2.0, appVersion v0.2.0).
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - ingress
  - gateway
  - sozu
  - clever-cloud
home: https://github.com/CleverCloud/sozu-gateway
sources:
  - https://github.com/CleverCloud/sozu-gateway
