# Default values for the sozu-gateway add-on.

# The data plane is the one component whose loss is immediately user-visible, so
# it defaults to spare capacity rather than to the smallest possible footprint.
# A single replica has no one to fail over to: while its Pod is being
# rescheduled the Service holds no endpoint at all, and callers get a connection
# error rather than a slower answer. Two, spread by the constraints below, leave
# someone still serving when one Pod goes away — which is what a rolling node
# replacement does, one worker at a time.
#
# Two is where the return stops: losing one Pod cost a single replica 4.8% and
# 8.0% of fresh connections in two trials, and cost two and three replicas
# nothing at all. The third replica only paid when a second loss overlapped the
# first. Raise it above two if you want that margin as well.
replicaCount: 2

# Disruption budget for the replicas above. Only rendered with more than one
# replica: over a single Pod a budget can only block every disruption or permit
# every one of them, and neither is a budget.
pdb:
  # `maxUnavailable`, not `minAvailable`: the two agree at two replicas and
  # diverge above it. `minAvailable: 1` on three replicas authorises evicting
  # two of them at once, which is a two-thirds capacity cut dressed up as a
  # budget.
  maxUnavailable: 1

image:
  controller:
    repository: ghcr.io/clevercloud/sozu-gateway-controller
    # Defaults to the chart appVersion when empty (set by the release workflow).
    tag: ""
    # When set (e.g. "sha256:…"), the image is pulled by digest instead of by
    # tag — immutable, so nobody can swap the content behind the reference.
    # The e2e suites use this for their throwaway ttl.sh images.
    digest: ""
    pullPolicy: IfNotPresent
  sozu:
    repository: clevercloud/sozu
    tag: "2.2.1"
    pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
# Singleton add-on: keep resource names stable regardless of release name.
fullnameOverride: "sozu-gateway"

# IngressClass this add-on creates and owns.
ingressClass:
  name: sozu
  # Mark as the cluster's default IngressClass (handles class-less Ingresses).
  default: false
  controllerValue: sozu.io/gateway-controller

controller:
  logLevel: info          # RUST_LOG (e.g. "info", "info,sozu_gw_controller=debug")
  debounceMs: 500         # coalesce bursts of watch events
  resyncSecs: 60          # periodic full resync; 0 disables it (Sōzu-restart
                          # detection then only runs on a command-socket reconnect)
  healthPort: 8081        # /healthz (liveness) + /readyz (readiness gated on first reconcile)

  # How long a watch may be silently dead before the client gives up and
  # re-lists. A replaced control plane leaves the connection open and silent
  # rather than closing it: no error, no event, and the reflector freezes while
  # every reconcile still "succeeds" against the frozen cache — the controller
  # serves stale routes while reporting healthy, and nothing in
  # `sozu_gw_controller_*` moves.
  #
  # This sets `timeoutSeconds` on every watch, which is also what kube-rs
  # derives its *client-side* idle timeout from (that value plus a 5s margin).
  # 0 restores kube-rs's default of 290s — i.e. up to ~5 minutes of blindness,
  # which is longer than a managed-cluster node replacement takes.
  #
  # Those are nominal. Measured, by cutting controllers off from the apiserver
  # and timing each one to its first logged watch error: 336-364s at the
  # default, 117-132s at 60. Both exceed their nominal bound and this experiment
  # does not establish why — idle expiry itself logs only at DEBUG, so what is
  # timed is the failed reconnect that follows it. Size alerts on the measured
  # figures, not on timeout+5.
  #
  # Measured across two upgrades of a managed cluster (1.34->1.35, 1.35->1.36):
  # with the default, 17.1% and 14.7% of fresh HTTP requests through the gateway
  # failed during node replacement, all HTTP 504 from Sozu against backends that
  # had already moved. At 60 both runs measured 0.000%, in every window, with no
  # watch errors. The cost is one watch reconnect per watch per minute, resumed
  # from the stored resourceVersion — not a re-LIST.
  watchTimeoutSecs: 60
  # Read timeout on the kube client's connections. kube enables HTTP/1 only, so
  # this bounds each watch's own connection. It also bounds the blindness, but
  # by tearing the connection: it costs a watch error and a backoff every time
  # it fires on a quiet watch, where watchTimeoutSecs resumes cleanly. Prefer
  # watchTimeoutSecs; 0 keeps kube-rs's default, which is *no* timeout.
  kubeReadTimeoutSecs: 0

# Prometheus /metrics on the controller. Each scrape serves the controller's own
# health signals (sozu_gw_controller_*: last successful reconcile, failures,
# shadow resets) and pulls Sōzu's data-plane metrics over the command socket
# (Sōzu has no native /metrics endpoint).
#
# On by default: without it there is no record of what the data plane was doing,
# and nobody turns metrics on *after* the outage that needed them. A scrape is
# not free, though — it rides the same command socket as routing applies, so see
# docs/UPGRADING.md before enabling it on a busy or very large cluster.
metrics:
  enabled: true
  port: 9100              # container port + ClusterIP Service port for /metrics
  serviceMonitor:
    enabled: false        # requires the Prometheus Operator (monitoring.coreos.com)
    interval: 30s
    additionalLabels: {}  # e.g. { release: kube-prometheus-stack } to match the operator's selector

rbac:
  # Grant ingresses/status so the controller can publish the gateway's
  # LoadBalancer address into each Ingress's .status (the ADDRESS column, read by
  # external-dns &co). When on, the chart also points the controller at its own
  # Service via SOZU_GW_PUBLISH_SERVICE. Off by default for least-privilege.
  allowStatusWrites: false
  # Grant gatewayclasses/gateways/httproutes status writes. Unlike the optional
  # Ingress LB-address write above, status conditions are integral to the
  # Gateway API — they ARE its UX (Accepted/Programmed/ResolvedRefs) — so this
  # defaults to on. Turn it off for least-privilege deployments that accept
  # degraded status; the chart then also tells the controller to skip the
  # writes (they are best-effort either way).
  #
  # What "degraded status" means, spelled out: this switch covers EVERY route
  # kind, not just HTTPRoute. With it off, a route that this controller refuses
  # — an unsupported filter, an unresolvable backend, a port nobody exposes —
  # reads exactly like one it serves. The only remaining signal is the Warning
  # Event on the object (`kubectl describe`), which is granted separately and
  # unconditionally.
  allowGatewayStatusWrites: true

# Ports this gateway exposes. Single source of truth for the Service's ports,
# Sōzu's listeners, and what a Gateway API listener may declare.
#
#   port  — advertised: what a Gateway `listeners[].port` declares and what
#           clients dial. This is the Service port.
#   bind  — where Sōzu listens inside the Pod. Cannot be privileged: both
#           containers run as uid 1000 with all capabilities dropped, so 80 and
#           443 are unreachable and map to 8080/8443 below.
#   protocol  — the Gateway API listener protocol served here.
#   transport — the Service port's protocol. Separate on purpose: a Service only
#           knows TCP/UDP/SCTP and the apiserver rejects `protocol: HTTP`.
#   owner — optional, layer-4 only: the namespace allowed to claim this port. A
#           layer-4 port carries exactly one route and has no hostname to
#           arbitrate with, so it names its owner rather than letting two
#           Gateways race for it. HTTP/HTTPS multiplex on hostname and stay
#           shared.
#
# `bind` values must be unique — two entries on one socket cannot both be added,
# and the failure takes the whole reconcile with it.
#
# A TCP or UDP entry is what makes a `protocol: TCP` / `protocol: UDP` Gateway
# listener — and the TCPRoute/UDPRoute attached to it — possible at all. Add one
# per layer-4 port you intend to serve:
#
#   - name: postgres
#     port: 5432
#     bind: 5432
#     protocol: TCP
#     transport: TCP
#     owner: demo          # optional: only Gateways in `demo` may declare it
#
# Ports must be > 1024: the data plane runs unprivileged. 443 in particular
# cannot be added — the Service already publishes 443/TCP for `https`, and a
# Service cannot expose one (port, protocol) twice.
exposure:
  - name: http
    port: 80
    bind: 8080
    protocol: HTTP
    transport: TCP
  - name: https
    port: 443
    bind: 8443
    protocol: HTTPS
    transport: TCP

# Sōzu data-plane sidecar.
sozu:
  workerCount: 2
  # Stopping the proxy on purpose, because it will not stop itself. Sōzu
  # registers no signal handler, and a signal with no handler is discarded when
  # it reaches PID 1 of a container — so on an ordinary Pod deletion the proxy
  # keeps running until the grace period expires and the kubelet SIGKILLs it,
  # losing the response to every request still in flight. `sozu shutdown` over
  # the command socket is the real graceful stop, and a preStop hook is the only
  # place left to call it from.
  #
  # What it actually drains: HTTP/1 exchanges in progress, and HTTP/2 streams.
  # TCPRoute and UDPRoute sessions, WebSockets, TLS handshakes still in progress
  # and idle keep-alives are cut at the first tick after the delay — for those
  # tenants `gracePeriodSeconds` buys nothing, and only `delaySeconds` moves when
  # the cut happens.
  drain:
    # Set false when replacing the Sōzu image with one that has no shell: the
    # hook would then fail on every deletion and the Pod would wait out the grace
    # period regardless, which is worse than not having it. With the hook off the
    # grace period is left at Kubernetes' own default.
    enabled: true
    # Wait before stopping, so the Pod is out of the Service's endpoints before
    # the proxy stops accepting. Endpoint withdrawal races preStop; without this
    # the datapath still points at a proxy that has begun shutting down.
    #
    # Five seconds covers kube-proxy and the CNI. It does NOT cover an external
    # load balancer: under `service.externalTrafficPolicy: Local` the LB stops
    # sending only once its own health check fails, often 10-30s, by which time
    # the listener is already closed — so new connections are refused rather than
    # served. Raise this to at least the load balancer's depool time if you
    # depend on one.
    delaySeconds: 5
    # Ceiling for the whole sequence: the delay above, then draining whatever is
    # still in flight. Must stay above `delaySeconds` — the kubelet SIGKILLs when
    # it expires, which is the outcome this exists to avoid.
    #
    # It does not bound a long-lived exchange. A streaming response re-arms
    # Sōzu's back timeout on every byte, and a slow upload can hold until its
    # front timeout; either can outlast this budget, and the hook then fails and
    # the kubelet kills the Pod moments after the grace period. The same hook
    # runs on a liveness-triggered restart, so a proxy wedged on its command
    # socket spends the whole budget before being replaced.
    gracePeriodSeconds: 40
  logLevel: info
  # Listener-level knobs Sōzu parses from its own config.toml. None of these
  # reach the IR: the HTTP/HTTPS listeners are declared at boot and re-creating
  # one would drop its certificate store, so they are set here or not at all.
  # Empty entries are omitted from the rendered config, leaving Sōzu's own
  # default in force.
  hardening:
    # Header carrying Sōzu's per-request id (its default is "Sozu-Id").
    sozuIdHeader: ""
    # Require a request's Host/:authority to exact-match the negotiated TLS SNI
    # (CWE-346/CWE-444). HTTPS only. **Sōzu defaults this to true**, which is
    # why it is left unset here rather than defaulted in the chart. Set it to
    # false only if you knowingly serve hostname-less catch-all routes over
    # HTTPS, or drive clients with a Host that differs from the SNI.
    strictSniBinding: null
    # Append a proxy-generated X-Real-IP carrying the peer address.
    sendXRealIp: false
    # Strip any client-supplied X-Real-IP before forwarding (anti-spoofing).
    # Independent of sendXRealIp — enabling both is the usual pairing.
    elideXRealIp: false
    # Per-status answer templates are deliberately NOT exposed here. Sōzu wants
    # a complete HTTP response, status line included — an `inline:` body of bare
    # HTML is rejected — and a template it cannot parse makes it fail to add any
    # listener at all, so the whole data plane comes up dead. Carrying a
    # CRLF-bearing raw response through a values scalar is not worth that blast
    # radius; answer overrides want a mounted file and their own change.
    # HSTS (RFC 6797) applied to every HTTPS frontend that declares none of its
    # own. Rejected by Sōzu on an HTTP listener, so it is rendered only under
    # the HTTPS one. Off by default: a max-age served by mistake is remembered
    # by browsers long after the mistake is fixed.
    hsts:
      enabled: false
      maxAge: 31536000
      includeSubdomains: false
      preload: false

  # Timeouts, in whole seconds. Like `hardening` above, an empty entry is
  # omitted and leaves Sōzu's own default in force — so `timeouts: {}` is not
  # "no timeouts", it is Sōzu's (connect 3, front 60, back 30, request 10).
  #
  # These reach the HTTP and HTTPS listeners, which are the ones declared in
  # Sōzu's config file. They do NOT reach layer-4: a TCPRoute or UDPRoute
  # listener is created by the controller over the command socket and carries
  # its own fixed budgets. Turning `connect` here changes nothing for a database
  # behind a TCPRoute.
  timeouts:
    # How long Sōzu waits for a backend to accept a connection. Sōzu's own
    # default is 3s, which is longer than most callers will wait: a backend that
    # has gone silent burns the caller's whole budget and the failure is
    # recorded on the client as a hang, with nothing proxy-side to attribute it
    # to — no 504, no `backend_timeout` in the access log, no `http.status.504`.
    #
    # 2s rather than 1s, deliberately. Linux sends its first SYN retransmit at
    # 1s, so a 1s budget cannot absorb even a single lost SYN — routine enough
    # during pod churn, while conntrack and the CNI's maps catch up. And the
    # cost of being wrong is not a slow success: a connect that times out is
    # answered 504 with no retry and no failover, and it does not even mark the
    # backend down, because that path never records a connection failure. 2s
    # still lands inside a typical caller's patience while leaving room for one
    # retransmit.
    #
    # None of this is failover. Sōzu retries another backend only when a
    # connection is actively refused. Raise this if a legitimately slow-to-accept
    # backend — a cold runtime, a saturated accept queue — starts being cut off.
    connect: 2
    # Inactivity on the client-facing socket (Sōzu default 60).
    front: null
    # Inactivity on the backend socket (Sōzu default 30).
    back: null
    # Time to receive a whole request since the connection opened (default 10).
    request: null

service:
  type: LoadBalancer
  externalTrafficPolicy: Local
  # Ports come from `exposure` above — this is the single source.
  annotations: {}

# Both containers run as this uid so they can share the command socket on the
# emptyDir volume.
runAsUser: 1000

# Modest default *requests* only: without them the Pod lands in the
# BestEffort QoS class and the gateway is the first thing evicted under node
# pressure. Limits are deliberately left unset — requests alone fix the
# QoS/eviction class, while a CPU limit would throttle the data path under
# load. Override freely (and add limits if your platform mandates them).
resources:
  controller:
    requests:
      cpu: 100m
      memory: 128Mi
  sozu:
    requests:
      cpu: 250m
      memory: 256Mi

# Spread the replicas so that one failure domain cannot hold all of them. The
# chart fills in each constraint's `labelSelector` from its own selector labels:
# a hand-written selector that drifts from them silently spreads nothing, and a
# constraint that matches no Pod reports no error.
#
# The host constraint is hard, because a soft one measurably does not hold. As a
# preference it is one score among several and loses: across eight observed
# rollouts on a three-node cluster a soft constraint put two replicas on one node
# and left another empty every single time, and nothing undoes that afterwards —
# the scheduler places Pods, it never moves running ones. `DoNotSchedule` placed
# one per node on every run.
#
# It does not stall a rollout, because `matchLabelKeys` counts only the incoming
# revision: the surge Pod always sees a node its own revision has not taken yet.
# The two belong together — hard spreading without that scoping would deadlock at
# the first surge.
#
# What it costs is concentration, not schedulability. `maxSkew: 1` forbids a node
# from holding two more Pods of a revision than the emptiest eligible node does;
# it does not demand a node per Pod. Above the node count the replicas stack
# evenly rather than staying `Pending` — measured, five replicas on four nodes
# scheduled 2,1,1,1 and all reached `Running`. A Pod that does stay `Pending`
# here is short of a node for some other reason (taints, resources), not short of
# skew. The shape suits an edge proxy behind `externalTrafficPolicy: Local`,
# where a Pod on every node matters more than a count of Pods.
#
# The zone constraint stays soft: a constraint whose `topologyKey` no node carries
# is skipped in silence, so on a cluster without `topology.kubernetes.io/zone`
# labels it does nothing at all, and making it hard there would be a hard
# requirement nobody can satisfy.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway

nodeSelector: {}
tolerations: []
affinity: {}

# Automatically create a dedicated controller + Sōzu Deployment and Service
# for each Gateway owned by this controller. The provisioner creates resources
# in the release namespace and removes only resources belonging to this
# installation and the deleted Gateway UID. No Gateway names are predeclared.
#
# Opt-in: enabling this moves existing Gateway traffic to new addresses. The
# original Deployment and Service continue serving Ingresses. With it disabled,
# both Ingress and Gateway routes retain the existing shared deployment model.
gatewayProvisioning:
  enabled: false
  # Null inherits replicaCount. Every instance also inherits images, resources,
  # exposure, scheduling, drain, TLS hardening, timeouts and metrics settings.
  replicaCount: null
  # Override selected Service fields for generated Gateways only. An explicit
  # annotations: {} clears the global annotations rather than merging them.
  service: {}
