[package]
name = "sozu-gw-builder"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# Builder = Kubernetes objects -> IR (+ per-object status results).
# Resolves Service->EndpointSlice and TLS Secrets, validates references.
# Uses k8s-openapi *types* but performs no live API I/O itself.
[dependencies]
sozu-gw-ir = { workspace = true }
sozu-gw-gateway-api = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Reuse Sōzu's PEM chain splitter for TLS Secret handling (no socket I/O).
sozu-command-lib = { workspace = true }
# Tenant input Sōzu would reject is refused here, with the same calls Sōzu
# makes, so it becomes a per-object Problem instead of a request that fails
# every reconcile of the shared instance (translation is all-or-nothing).
#
# A `Regex` path rule is compiled by Sōzu with `regex::bytes::Regex::new`
# (default flags, no builder limits). The lock resolves this to 1.13.1, the
# version Sōzu 2.2.1 builds against, so the accepted grammar is the same;
# tests/sozu_lock_pins.rs fails if a lock refresh moves it (or regex-syntax).
regex = "1"
# A `tls.key` is parsed by Sōzu with `rustls_pki_types::PrivateKeyDer` and
# loaded with the ring provider; the pairing check against `tls.crt` is ours.
# `ring` is what the lock already resolves rustls to (via kube): no aws-lc.
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
# Every frontend hostname is parsed by Sōzu's router with
# `idna::domain_to_ascii` (default features, UTS-46 with the compiled Unicode
# data), and a failure rejects the whole `Add*Frontend` request. Pinned to the
# version Sōzu 2.2.1 builds against; its Unicode backend (idna_adapter, icu_*)
# is held at Sōzu's versions by the lock alone, which tests/sozu_lock_pins.rs
# checks.
idna = "=1.1.0"

[dependencies.k8s-openapi]
version = "0.28"
features = ["v1_36"]

[dev-dependencies]
insta = { version = "1", features = ["json", "redactions"] }
serde_json = { workspace = true }
# Integration tests construct k8s objects, so the type crates must be dev-deps too.
k8s-openapi = { version = "0.28", features = ["v1_36"] }
sozu-gw-gateway-api = { workspace = true }
sozu-gw-ir = { workspace = true }
sozu-gw-translator = { workspace = true }
