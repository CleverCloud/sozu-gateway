[package]
name = "sozu-gw-ir"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# IR = neutral Rust structs mapped 1:1 onto Sōzu's vocabulary.
# MUST stay free of I/O: no kube, no socket, no sozu-command-lib.
[dependencies]
serde = { workspace = true }

[dev-dependencies]
# The equivalence test compiles each generated rule the way Sōzu does, on the
# `regex` version Sōzu 2.2.1 builds against (pinned in the lock, see the
# builder's manifest).
regex = "1"
